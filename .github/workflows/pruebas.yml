name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Lint, tipos, pruebas, playground y extensión
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=github-actions
      - run: npm run playground:build
      - run: xvfb-run -a npm run vscode:test
      - run: npm run vscode:package
      - uses: actions/upload-artifact@v4
        with:
          name: kuntur-vscode
          path: vscode/kuntur.vsix
