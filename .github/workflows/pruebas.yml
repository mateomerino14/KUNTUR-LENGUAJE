name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=github-actions
